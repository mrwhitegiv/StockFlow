spring:
  application:
    name: stockflow
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:stockflow}?connectionTimeZone=UTC&connectTimeout=3000&socketTimeout=3000
    username: ${DB_USERNAME:stockflow}
    password: ${DB_PASSWORD:}
    hikari:
      connection-timeout: 3000
      validation-timeout: 2000
      maximum-pool-size: 5
server:
  port: ${SERVER_PORT:8080}
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
